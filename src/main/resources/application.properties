spring.application.name=stol-trainer

# H2 Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

# JPA Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# Server Configuration
server.port=${SERVER_PORT:8290}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}

# JWT Configuration
jwt.secret=${JWT_SECRET:MyVerySecureSecretKeyForJWTTokenGenerationAndValidation1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.stoltrainer=${LOG_LEVEL_APP:DEBUG}

# Application Configuration
app.name=${APP_NAME:Stol Trainer}
app.version=${APP_VERSION:1.0.0-MVP}
